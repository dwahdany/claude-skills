[project]
name = "prime-agent-skill-gworkspace"
version = "0.1.0"
description = "Google Workspace (Docs/Drive/Gmail/Calendar) integration skill for Prime Agent via a local workspace-mcp server."
requires-python = ">=3.10"
dependencies = ["mcp", "httpx", "prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gworkspace"]
