<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Transcript excerpt</title>
<link rel="stylesheet" href="figure.css"><script src="measure.js"></script>
<style> .fig { padding: 24px; } </style></head>
<body><div class="fig">
  <div class="transcript">
    <div class="transcript__head"><span class="chip">Reasoning</span><span class="transcript__speaker">model-name-variant</span></div>
    <div class="transcript__body">
      <p><span class="elide">[...]</span> first sentence of the excerpt, quoted verbatim.</p>
      <p>Second paragraph. Keep the model's own wording; mark every cut with a gray <span class="elide">[...]</span> and do not reorder.</p>
      <p>Use <b>bold</b> only for the clause the figure is about. <span class="elide">[...]</span></p>
    </div>
  </div>
</div></body></html>
